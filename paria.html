<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paria</title>
  <meta name="description" content="Paria — ای قشنگ‌ترین پریا" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; overflow-x: hidden; }

    body {
      font-family: 'Vazirmatn', sans-serif;
      min-height: 100vh;
      width: 100%;
      background-color: #1a0f14;
      background-image:
        radial-gradient(circle at 18% 8%, rgba(224, 140, 155, 0.32), transparent 55%),
        radial-gradient(circle at 88% 82%, rgba(210, 160, 120, 0.24), transparent 55%),
        linear-gradient(160deg, #22121a 0%, #37202a 35%, #55293a 65%, #713444 100%);
      background-attachment: fixed;
      background-size: cover;
      color: #fff6f2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 64px 20px;
      gap: 48px;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    /* پس‌زمینه سفارشی parbak در صورت وجود */
    body.custom-bg {
      background-image: url('parbak.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    /* ---- گلبرگ‌های در حال باد (یک‌طرفه) ---- */
    #petals {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .petal {
      position: absolute;
      top: -8%;
      width: 10px;
      height: 13px;
      clip-path: path('M5 0C8 2 10 6 8 10C7 12.5 3 12.5 2 10C0 6 2 2 5 0Z');
      background: linear-gradient(140deg, #fff5f5, #fbc7c7 55%, #e78f8f 100%);
      filter: drop-shadow(0 0 3px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 6px rgba(255, 255, 255, 0.5));
      opacity: 0;
      will-change: transform, opacity;
      animation-name: petalFall;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    @keyframes petalFall {
      0%   {
        top: -8%;
        opacity: 0;
        transform: translateX(0) rotate(0deg);
      }
      6%  { opacity: 0.95; }
      92% { opacity: 0.75; }
      100% {
        top: 106%;
        opacity: 0;
        transform: translateX(var(--drift)) rotate(var(--spin));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .petal { animation: none; display: none; }
      .fade-in { animation: none; opacity: 1; transform: none; }
    }

    /* ---- محتوا ---- */
    .poem-box, .photo-wrap {
      position: relative;
      z-index: 1;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeInUp 1.1s ease forwards;
    }
    .photo-wrap { animation-delay: 0.35s; }

    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .top-ornament {
      font-size: 1.3rem;
      color: #f3bcc0;
      text-shadow: 0 0 14px rgba(240, 184, 190, 0.55);
      text-align: center;
      margin-bottom: 16px;
    }

    .poem-box {
      text-align: center;
      max-width: 460px;
    }

    .poem-line {
      font-family: 'Noto Nastaliq Urdu', serif;
      font-size: clamp(1.4rem, 4.6vw, 2rem);
      font-weight: 600;
      color: #fff6f2;
      line-height: 2.25;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.45), 0 0 20px rgba(227, 156, 156, 0.35);
    }

    .divider-heart {
      margin: 28px auto 0;
      width: 56%;
      max-width: 200px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 226, 226, 0.55) 50%, transparent);
    }

    .photo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .photo-frame {
      width: min(300px, 78vw);
      aspect-ratio: 4 / 5;
      border-radius: 20px;
      overflow: hidden;
      border: 1.5px solid rgba(255, 226, 226, 0.35);
      box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.4),
        0 0 34px rgba(227, 156, 156, 0.4),
        inset 0 0 24px rgba(255, 255, 255, 0.06);
      background: rgba(255, 255, 255, 0.03);
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo-name {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.55rem;
      font-weight: 500;
      letter-spacing: 4px;
      direction: ltr;
      background: linear-gradient(90deg, #f6d6d6, #ffe6c4 45%, #f6d6d6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 18px rgba(255, 220, 180, 0.3);
    }

    @media (max-width: 380px) {
      body { padding: 48px 16px; gap: 36px; }
      .poem-line { line-height: 2.05; }
    }
  </style>
</head>
<body>

  <div id="petals"></div>

  <div class="poem-box">
    <div class="top-ornament">❀</div>
    <div class="poem-line">
      ای قشنگ‌ترین پریا<br>
      تنها تو کوچه نریا<br>
      بچه‌های محل دزدن<br>
      عشق منو می‌دزدن<br>
      عشق منو می‌دزدن
    </div>
    <div class="divider-heart"></div>
  </div>

  <div class="photo-wrap">
    <div class="photo-frame">
      <img src="Paria.jpg" alt="Paria" onerror="this.parentElement.style.display='none'" />
    </div>
    <div class="photo-name">Paria</div>
  </div>

  <script>
    // ---- تشخیص parbak.jpg برای پس‌زمینه سفارشی ----
    (function () {
      const bgImg = new Image();
      bgImg.onload = function () {
        document.body.classList.add('custom-bg');
      };
      bgImg.onerror = function () {
        // parbak.jpg موجود نیست، همون گرادیان رزی-طلایی پیش‌فرض باقی می‌مونه
      };
      bgImg.src = 'parbak.jpg';
    })();

    (function () {
      const container = document.getElementById('petals');
      const count = 26;
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'petal';

        const size = Math.random() * 7 + 7;
        p.style.width = size + 'px';
        p.style.height = (size * 1.3) + 'px';
        p.style.left = Math.random() * 100 + '%';

        p.style.setProperty('--drift', (Math.random() * 90 + 130) + 'px');
        p.style.setProperty('--spin', (Math.random() * 260 + 220) + 'deg');

        const fallDuration = Math.random() * 6 + 8;
        const fallDelay = Math.random() * 10;
        p.style.animationDuration = fallDuration + 's';
        p.style.animationDelay = fallDelay + 's';

        container.appendChild(p);
      }
    })();
  </script>

</body>
</html>
